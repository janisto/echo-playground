components:
  headers:
    CacheControl:
      schema:
        const: no-store
        type: string
    ContentTypeOptions:
      schema:
        const: nosniff
        type: string
    FrameOptions:
      schema:
        const: DENY
        type: string
    Link:
      description: RFC 8288 relative next and previous navigation.
      schema:
        type: string
    Location:
      schema:
        const: /v1/profile
        type: string
    RateLimitReset:
      description: Optional validated nonnegative safe-integer reset epoch.
      schema:
        maximum: 9007199254740991
        minimum: 0
        type: integer
    ReferrerPolicy:
      schema:
        const: strict-origin-when-cross-origin
        type: string
    RetryAfter:
      description: Nonnegative safe-integer delay in seconds.
      schema:
        maximum: 9007199254740991
        minimum: 0
        type: integer
    Vary:
      description: Response selection variance.
      schema:
        type: string
    WWWAuthenticate:
      schema:
        const: Bearer
        type: string
    XRequestID:
      description: Selected immutable request correlation value.
      schema:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        type: string
  parameters:
    Category:
      description: Exact category filter in the closed scalar query.
      in: query
      name: category
      required: false
      schema:
        enum:
        - electronics
        - tools
        - accessories
        - robotics
        - power
        - components
        type: string
    Cursor:
      description: Opaque scoped cursor in the closed scalar query.
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 2048
        minLength: 1
        pattern: ^[!-~]+$
        type: string
    Limit:
      description: Closed scalar query; unknown or repeated parameters are rejected.
      in: query
      name: limit
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    Owner:
      in: path
      name: owner
      required: true
      schema:
        maxLength: 39
        minLength: 1
        pattern: ^[A-Za-z0-9](?:[A-Za-z0-9_-]{0,37}[A-Za-z0-9])?$
        type: string
    Repository:
      in: path
      name: repo
      required: true
      schema:
        maxLength: 100
        minLength: 1
        pattern: ^(?=.*[A-Za-z0-9_-])[A-Za-z0-9._-]+$
        type: string
    XRequestID:
      description: A missing, invalid, repeated, or comma-combined candidate is replaced
        with a generated request ID.
      in: header
      name: X-Request-ID
      required: false
      schema:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        type: string
  schemas:
    BoundedName:
      maxLength: 100
      minLength: 1
      pattern: ^(?![\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])(?!.*[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]$)[^\u0000-\u001F\u007F-\u009F]*$
      type: string
    ContactEmail:
      maxLength: 254
      minLength: 3
      pattern: ^(?=.{1,64}@)(?!\.)(?![^@]*\.\.)(?![^@]*\.@)[A-Za-z0-9!#$%&'*+/=?^_{|}~.-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$
      type: string
    ErrorDetail:
      additionalProperties: false
      properties:
        detail:
          maxLength: 200
          minLength: 1
          type: string
        source:
          $ref: '#/components/schemas/ErrorSource'
      required:
      - detail
      type: object
    ErrorSource:
      oneOf:
      - additionalProperties: false
        properties:
          pointer:
            maxLength: 256
            minLength: 1
            type: string
        required:
        - pointer
        type: object
      - additionalProperties: false
        properties:
          parameter:
            maxLength: 256
            minLength: 1
            type: string
        required:
        - parameter
        type: object
      - additionalProperties: false
        properties:
          header:
            maxLength: 256
            minLength: 1
            type: string
        required:
        - header
        type: object
    GitHubActivity:
      additionalProperties: false
      allOf:
      - else:
          properties:
            actorAvatarUrl:
              format: uri
              pattern: ^https?://
              type: string
        if:
          properties:
            actor:
              type: "null"
          required:
          - actor
        then:
          properties:
            actorAvatarUrl:
