name: Scheduled mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  REQUIRE_FIREBASE_EMULATORS: '1'

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            functions/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Set up Just
        uses: extractions/setup-just@v4.0.0

      - name: Install Gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 # zizmor: ignore[adhoc-packages]

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0 # zizmor: ignore[adhoc-packages]

      - name: Run mutation campaigns with required emulators
        run: firebase emulators:exec --only auth,firestore --project demo-test-project "just mutation"
