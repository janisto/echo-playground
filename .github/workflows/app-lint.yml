name: App code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Lint root module
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11

  lint-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: functions/go.sum

      - name: Lint function module
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11
          working-directory: functions

  lint:
    if: ${{ always() }}
    needs:
      - lint-root
      - lint-functions
    runs-on: ubuntu-latest
    steps:
      - name: Require all lint jobs
        env:
          ROOT: ${{ needs['lint-root'].result }}
          FUNCTIONS: ${{ needs['lint-functions'].result }}
        run: |
          test "$ROOT" = success
          test "$FUNCTIONS" = success
