# Auto-label PRs based on changed file paths
# Docs: https://github.com/actions/labeler

# Internal changes in app folders
app:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/**'
          - 'internal/**'
          - 'api-docs/**'

# Functions changes in functions folder
functions:
  - changed-files:
      - any-glob-to-any-file: 'functions/**'

# Documentation and repository guidance
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'AGENTS.md'
          - '.github/**/*.md'
          - '.agents/**/*.md'

# Build, quality, container, and repository automation
tooling:
  - changed-files:
      - any-glob-to-any-file:
          - 'Justfile'
          - 'go.mod'
          - 'go.sum'
          - 'functions/go.mod'
          - 'functions/go.sum'
          - '.golangci.yml'
          - 'Dockerfile'
          - '.dockerignore'
          - 'firebase.json'
          - '.github/workflows/**'

# Branch-name based labels
feature:
  - head-branch: ['^feature', 'feature']

bug:
  - head-branch: ['^bug', 'bug']

improvement:
  - head-branch: ['^improve', 'improve', 'improvement']
